<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatOutline</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
    }
    .badge {
      background: #10a37f;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge.free {
      background: #475569;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10a37f;
      margin-right: 6px;
    }
    .feature-list {
      margin: 6px 0 0 0;
      padding-left: 16px;
      color: #94a3b8;
      font-size: 11px;
    }
    .feature-list li {
      margin-bottom: 3px;
    }
    .pro-box {
      background: linear-gradient(135deg, rgba(16, 163, 127, 0.15), rgba(2, 132, 199, 0.15));
      border: 1px solid rgba(16, 163, 127, 0.35);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .pro-title {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 2px;
    }
    .pro-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .buy-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #10a37f;
      color: #fff;
      text-decoration: none;
      padding: 7px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .buy-btn:hover {
      background: #0d8a6a;
    }
    .license-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .license-input {
      flex: 1;
      padding: 5px 8px;
      font-size: 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      color: #f8fafc;
      outline: none;
      box-sizing: border-box;
    }
    .license-btn {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      border-radius: 6px;
      cursor: pointer;
    }
    .license-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .feedback-msg {
      font-size: 11px;
      margin-top: 6px;
      min-height: 16px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .footer a {
      color: #94a3b8;
      text-decoration: none;
    }
    .footer a:hover {
      color: #10a37f;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="assets/icon48.png" class="icon" alt="Logo" />
    <span class="title">ChatOutline</span>
    <span class="badge free" id="header-badge">FREE</span>
  </div>

  <div class="status-card">
    <div style="font-weight: 600; margin-bottom: 2px;">
      <span class="status-dot"></span>扩展运行中
    </div>
    <div style="color: #94a3b8; font-size: 11px;">
      已支持 ChatGPT / Gemini / Claude / DeepSeek
    </div>
    <ul class="feature-list">
      <li>✅ 问答大纲目录与顺滑跳转 (永久免费)</li>
      <li>✅ 全文关键词快速过滤 (永久免费)</li>
      <li id="codehub-status-item">💎 Code Hub 代码块归类提取 (Pro)</li>
    </ul>
  </div>

  <div class="pro-box" id="pro-box">
    <div class="pro-title">💎 解锁 ChatOutline Pro</div>
    <div class="pro-desc">$3.00 美元买断，终身解锁 Code Hub 完整代码提取与高级功能</div>
    <a href="https://lusam.gumroad.com/l/chatoutline" target="_blank" class="buy-btn" id="buy-btn">获取 Pro 授权 ($3.00)</a>
    <div class="license-row">
      <input type="text" class="license-input" id="license-input" placeholder="输入授权码激活..." />
      <button class="license-btn" id="activate-btn">激活</button>
    </div>
    <div class="feedback-msg" id="feedback-msg"></div>
  </div>

  <div class="footer">
    <span>v1.0.0</span>
    <a href="https://github.com/SamLu574/chatoutline-pro" target="_blank">GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
